<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Women — Vrinda Sethi</title>
<meta name="description" content="Lehengas, sarees, anarkalis and bridal couture, hand-made in the Vrinda Sethi atelier.">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-cat="women">
<div id="site-header"></div>

<main>
  <nav class="crumb" id="crumb"></nav>
  <div class="plp__head" id="plpHead"></div>
  <div class="chips" id="chips"></div>

  <div class="filterbar">
    <div class="filterbar__l" id="filterToggle">Filters</div>
    <div></div>
    <div class="filterbar__r">
      <label for="sortSel">Sort by :</label>
      <select id="sortSel">
        <option value="popular">Popular</option>
        <option value="new">Newest First</option>
        <option value="low">Price — Low to High</option>
        <option value="high">Price — High to Low</option>
        <option value="disc">Discount</option>
      </select>
      <div class="viewtoggle">
        <button data-cols="2" aria-label="Two columns"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8"/><rect x="3" y="13" width="18" height="8"/></svg></button>
        <button data-cols="3" class="is-on" aria-label="Three columns"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
      </div>
    </div>
  </div>

  <div class="plp">
    <aside class="facets" id="facets"></aside>
    <div class="plp__grid">
      <div id="grid" class="grid-3"></div>
      <div class="plp__more" id="more"></div>
    </div>
  </div>

  <section class="plp__seo" id="seo"></section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/plp.js"></script>
</body>
</html>
